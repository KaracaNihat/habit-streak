name: Backend CI

on:
  pull_request:
    paths:
      - 'habit-streak-backend/**'

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Make mvnw executable
        run: chmod +x ./habit-streak-backend/mvnw

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Lint (Spotless Check)
        run: |
          cd habit-streak-backend
          ./mvnw spotless:check

      - name: Build and Test Backend
        run: |
          cd habit-streak-backend
          ./mvnw clean verify