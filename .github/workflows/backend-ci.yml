name: Backend CI

on:
  pull_request:
    paths:
      - 'habit-streak-backend/**'

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongo --eval 'db.adminCommand(\"ping\")'" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    env:
      # Important: use the service name as host
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/habitdb

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Make mvnw executable
        run: chmod +x ./habit-streak-backend/mvnw

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Lint (Spotless Check)
        run: |
          cd habit-streak-backend
          ./mvnw spotless:check

      - name: Wait for MongoDB to be ready
        run: |
          for i in {1..30}; do
            mongo --host mongo --eval "db.adminCommand('ping')" && break
            echo "Waiting for MongoDB..."
            sleep 2
          done

      - name: Build and Test Backend
        run: |
          cd habit-streak-backend
          ./mvnw clean verify
