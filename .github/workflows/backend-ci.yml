name: Backend CI

on:
  pull_request:
    paths:
      - 'habit-streak-backend/**'

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make mvnw executable
        run: chmod +x ./habit-streak-backend/mvnw

      - name: Lint (Spotless Check)
        run: |
          cd habit-streak-backend
          ./mvnw spotless:check

      - name: Build and Test Backend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          cd habit-streak-backend
          ./mvnw clean verify
